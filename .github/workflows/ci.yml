---
name: CI/CD
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:  # checkov:skip=CKV_GHA_7:workflow_dispatch inputs are required to select the pipeline
    inputs:
      workflow:
        required: true
        type: choice
        options:
          - lint-and-scan
          - upgrade
        description: Choose the workflow to run
        default: lint-and-scan
jobs:
  cloudformation-lint:
    if: >
      github.event_name == 'push'
      || github.event_name == 'pull_request'
      || (github.event_name == 'workflow_dispatch' && inputs.workflow == 'lint-and-scan')
    permissions:
      contents: read
    uses: dceoy/gha-for-devops/.github/workflows/aws-cloudformation-lint.yml@main  # zizmor: ignore[unpinned-uses]
    with:
      search-path: .
      python-version: '3.13'
  terraform-lint-and-scan:
    if: >
      github.event_name == 'push'
      || github.event_name == 'pull_request'
      || (github.event_name == 'workflow_dispatch' && inputs.workflow == 'lint-and-scan')
    permissions:
      contents: write
    uses: dceoy/gha-for-devops/.github/workflows/terraform-lint-and-scan.yml@main  # zizmor: ignore[unpinned-uses]
    with:
      submit-dependencies: true
      snapshot-correlator: terraform-source
      search-path: .
      terraform-version: latest
  terraform-lock-files-upgrade:
    if: github.event_name == 'workflow_dispatch' && inputs.workflow == 'upgrade'
    permissions:
      contents: write
      pull-requests: write
    uses: dceoy/gha-for-devops/.github/workflows/terraform-lock-files-upgrade.yml@main  # zizmor: ignore[unpinned-uses]
    with:
      terraform-working-directories: envs/plt
      terraform-version: latest
    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  dependabot-auto-merge:
    if: >
      github.event_name == 'pull_request'
      && github.event.pull_request.user.login == 'dependabot[bot]'
    needs:
      - cloudformation-lint
      - terraform-lint-and-scan
    permissions:
      contents: write
      pull-requests: write
      actions: read
      checks: read
      statuses: read
    uses: dceoy/gha-for-devops/.github/workflows/dependabot-auto-merge.yml@main  # zizmor: ignore[unpinned-uses]
    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
